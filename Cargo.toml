[package]
name = "unix-ancillary"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Safe, ergonomic Unix socket ancillary data (SCM_RIGHTS fd passing) with OwnedFd/BorrowedFd"
license = "MIT"
repository = "https://github.com/MohibShaikh/unix-ancillary"
keywords = ["unix", "socket", "fd-passing", "ancillary", "scm-rights"]
categories = ["os::unix-apis", "network-programming"]
exclude = ["/fuzz", "/target", "/.github", "/docs", "/AGENTS.md"]

[dependencies]
libc = "0.2"
tokio = { version = "1", optional = true, default-features = false, features = ["net"] }

[features]
# Async fd passing on tokio's UnixStream/UnixDatagram. Off by default —
# blocking users pull in no extra dependencies.
tokio = ["dep:tokio"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["net", "rt", "macros", "io-util"] }

[package.metadata.docs.rs]
all-features = true
# The crate makes macOS-specific claims (RLIMIT_NOFILE probing for the recv
# cap, the fcntl CLOEXEC race). Build those targets so the docs prove them.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]

[[example]]
name = "async_pass_fd"
required-features = ["tokio"]

[[example]]
name = "agent_sandbox"
required-features = ["tokio"]
