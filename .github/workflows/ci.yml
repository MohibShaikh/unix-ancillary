name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose --all-targets
      - run: cargo test --verbose
      - run: cargo test --verbose --all-features
      - name: Verify SIGPIPE-safe send behavior
        run: cargo test --test fd_passing send_to_closed_peer_returns_error_without_sigpipe -- --nocapture
      - name: Verify descriptor leak regressions
        run: cargo test --test fd_leak -- --nocapture
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check
      - name: Compile the separate fuzz workspace
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Verify multiprocess handoff
        run: cargo run --quiet --example multiprocess
      - name: Verify downstream API compatibility
        run: cargo run --quiet --example dep_api_check
      - name: Verify read-only capability example
        run: cargo run --quiet --example agent_sandbox --features tokio

  msrv:
    name: msrv (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose --all-targets
      - run: cargo test
      - run: cargo check --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
